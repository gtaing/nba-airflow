[project]
name = "nba-airflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airflow-provider-duckdb>=0.2.0",
    "apache-airflow>=3.0.0",
    "apache-airflow-providers-amazon>=9.7.0",
    "boto3>=1.38.13",
    "duckdb>=1.3.2",
    "fsspec>=2025.5.1",
    "loguru>=0.7.3",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "s3fs>=2025.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[tool.pytest.ini_options]
pythonpath = [
  ".", "dags"
]
